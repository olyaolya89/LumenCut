# Optional. The desk also starts with ./startup.sh — no Docker, no Redis.
# Public UI stays on 8080 (TanStack). Worker is loopback/internal only.

services:
  worker:
    image: python:3.11-bookworm
    working_dir: /workspace
    command: >
      bash -lc "pip install -q -r worker/requirements.txt &&
      python3 -m worker.main"
    environment:
      LUMENCUT_WORKER_HOST: 0.0.0.0
      LUMENCUT_WORKER_PORT: "8091"
      LUMENCUT_DATA_DIR: /workspace/data
      DATA_DIR: /workspace/data
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://127.0.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      YOUTUBE_DATA_API_KEY: ${YOUTUBE_DATA_API_KEY:-}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      TTS_DEFAULT: ${TTS_DEFAULT:-edge}
      RENDER_ENGINE: ${RENDER_ENGINE:-ffmpeg}
      MAX_CLIP_MS: ${MAX_CLIP_MS:-5000}
      CONCURRENT_DOWNLOADS: ${CONCURRENT_DOWNLOADS:-6}
    volumes:
      - .:/workspace
      - ./data:/workspace/data
    expose:
      - "8091"

  web:
    image: node:22-bookworm
    working_dir: /workspace
    command: sh startup.sh
    ports:
      - "8080:8080"
    environment:
      LUMENCUT_WORKER_URL: http://worker:8091
      LUMENCUT_DATA_DIR: /workspace/data
      DATA_DIR: /workspace/data
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      XAI_API_KEY: ${XAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://127.0.0.1:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      YOUTUBE_DATA_API_KEY: ${YOUTUBE_DATA_API_KEY:-}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      TTS_DEFAULT: ${TTS_DEFAULT:-edge}
      RENDER_ENGINE: ${RENDER_ENGINE:-ffmpeg}
      MAX_CLIP_MS: ${MAX_CLIP_MS:-5000}
      CONCURRENT_DOWNLOADS: ${CONCURRENT_DOWNLOADS:-6}
    volumes:
      - .:/workspace
      - ./data:/workspace/data
    depends_on:
      - worker
